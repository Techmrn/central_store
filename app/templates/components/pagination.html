{% if pagination.total_pages > 1 %}

<nav class="mt-3">
    <ul class="pagination justify-content-center">

        <!-- Previous -->
        <li class="page-item {% if pagination.current_page == 1 %}disabled{% endif %}">
            <a class="page-link"
               href="#"
               onclick="loadTable({{ pagination.current_page - 1 }}); return false;">
                Previous
            </a>
        </li>

        <!-- Page Numbers -->
        {% for p in range(1, pagination.total_pages + 1) %}

        <li class="page-item {% if p == pagination.current_page %}active{% endif %}">
            <a class="page-link"
               href="#"
               onclick="loadTable({{ p }}); return false;">
                {{ p }}
            </a>
        </li>

        {% endfor %}

        <!-- Next -->
        <li class="page-item {% if pagination.current_page == pagination.total_pages %}disabled{% endif %}">
            <a class="page-link"
               href="#"
               onclick="loadTable({{ pagination.current_page + 1 }}); return false;">
                Next
            </a>
        </li>

    </ul>
</nav>

{% endif %}
