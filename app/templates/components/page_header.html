<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h2 class="fw-bold mb-1">
            {{ page_title }}
        </h2>

        {% if page_subtitle %}
        <p class="text-muted mb-0">
            {{ page_subtitle }}
        </p>
        {% endif %}
    </div>

    {% if new_button_url %}
    <a href="{{ new_button_url }}"
       class="btn btn-primary">

        <i class="bi bi-plus-circle me-1"></i>

        {{ new_button_text }}

    </a>
    {% endif %}

</div>

<hr class="mt-0 mb-4">
