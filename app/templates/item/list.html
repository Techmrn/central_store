{% extends "layout/base.html" %}

{% block title %}Item Master{% endblock %}

{% block content %}

<div class="container-fluid">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="mb-0">Item Master</h3>
            <small class="text-muted">
                Create and manage inventory items
            </small>
        </div>

        <div>

            <a
                href="/item/new"
                class="btn btn-primary">

                <i class="bi bi-plus-circle"></i>
                New Item

            </a>

        </div>

    </div>

    <!-- Success Message -->

    {% if success %}

    <div class="alert alert-success alert-dismissible fade show">

        {{ success }}

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>

    {% endif %}

    <!-- Error Message -->

    {% if error %}

    <div class="alert alert-danger alert-dismissible fade show">

        {{ error }}

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>

    {% endif %}

    <!-- Search -->

    <div class="card shadow-sm mb-3">

        <div class="card-body">

            <div class="row">

                <div class="col-md-5">

                    <input
                        type="text"
                        id="search"
                        class="form-control"
                        placeholder="Search Code, Name, Category or Unit..."
                        value="{{ search }}"

                        hx-get="/item/table"
                        hx-trigger="keyup changed delay:500ms"
                        hx-target="#table-container"
                        hx-swap="outerHTML"
                        hx-include="#search"
                        name="search">

                </div>

            </div>

        </div>

    </div>

    <!-- Table -->

    {% include "item/table_container.html" %}

</div>

{% endblock %}
