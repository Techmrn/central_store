{% extends "layout/base.html" %}

{% block title %}
{{ page_title }}
{% endblock %}

{% block content %}

<div class="container-fluid">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
            <li class="breadcrumb-item">Masters</li>
            <li class="breadcrumb-item"><a href="/role-permission/">Role Permission</a></li>
            <li class="breadcrumb-item active">{{ page_title }}</li>
        </ol>
    </nav>

    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">{{ page_title }}</h4>
        </div>
        <div class="card-body">
            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <form method="post" action="/role-permission/new">
                <div class="mb-3">
                    <label for="role_id" class="form-label">Select Role</label>
                    <select id="role_id" name="role_id" class="form-select" required>
                        <option value="">-- Choose Role --</option>
                        {% for role in roles %}
                        <option value="{{ role.id }}" {% if selected_role_id == role.id %}selected{% endif %}>
                            {{ role.name }} ({{ role.code }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label for="permission_id" class="form-label">Select Permission</label>
                    <select id="permission_id" name="permission_id" class="form-select" required>
                        <option value="">-- Choose Permission --</option>
                        {% for perm in permissions %}
                        <option value="{{ perm.id }}" {% if selected_permission_id == perm.id %}selected{% endif %}>
                            [{{ perm.module }}] {{ perm.name }} ({{ perm.code }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Save Assignment
                    </button>
                    <a href="/role-permission/" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
