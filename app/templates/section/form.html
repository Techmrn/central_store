{% extends "layout/base.html" %}

{% block title %}
{{ page_title }}
{% endblock %}

{% block content %}

<div class="container-fluid">

    {% include "components/page_header.html" %}

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <div class="card shadow-sm">

        <div class="card-body">

            {% if is_edit %}
            <form method="post" action="/section/{{ section_id }}/edit">
            {% else %}
            <form method="post" action="/section/new">
            {% endif %}

                <!-- Office -->

                <div class="mb-3">

                    <label class="form-label">
                        Office
                    </label>

                    <select
                        name="office_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Office
                        </option>

                        {% for office in offices %}

                        <option
                            value="{{ office.id }}"
                            {% if section and section.office_id == office.id %}
                                selected
                            {% endif %}
                        >
                            {{ office.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Code -->

                <div class="mb-3">

                    <label class="form-label">
                        Section Code
                    </label>

                    <input
                        type="text"
                        name="code"
                        class="form-control"
                        maxlength="20"
                        required
                        value="{{ section.code if section else '' }}">

                </div>


                <!-- Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Section Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        maxlength="100"
                        required
                        value="{{ section.name if section else '' }}">

                </div>


                <!-- Remarks -->

                <div class="mb-3">

                    <label class="form-label">
                        Remarks
                    </label>

                    <textarea
                        name="remarks"
                        class="form-control"
                        rows="3">{{ section.remarks if section else '' }}</textarea>

                </div>


                <div class="d-flex justify-content-end gap-2">

                    <a
                        href="/section/"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        {% if is_edit %}
                            Update Section
                        {% else %}
                            Save Section
                        {% endif %}

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
