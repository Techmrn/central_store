<table class="table table-hover align-middle">

    <thead class="table-light">

        <tr>

            <th style="width:20%;">
                Office
            </th>

            <th style="width:15%;">
                Code
            </th>

            <th>
                Section Name
            </th>

            <th style="width:10%;">
                Status
            </th>

            <th style="width:15%;" class="text-end">
                Actions
            </th>

        </tr>

    </thead>

    <tbody>

    {% for section in sections %}

        <tr>

            <td>

                {{ section.office.name }}

            </td>

            <td>

                {{ section.code }}

            </td>

            <td>

                {{ section.name }}

            </td>

            <td>

                {% if section.is_active %}

                    <span class="badge bg-success">
                        Active
                    </span>

                {% else %}

                    <span class="badge bg-danger">
                        Inactive
                    </span>

                {% endif %}

            </td>

            <td class="text-end">

                <a
                    href="/section/{{ section.id }}/edit"
                    class="btn btn-sm btn-warning">

                    Edit

                </a>

                <button
                    class="btn btn-sm btn-danger"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteModal{{ section.id }}">

                    Delete

                </button>

            </td>

        </tr>


        <!-- Delete Modal -->

        <div
            class="modal fade"
            id="deleteModal{{ section.id }}"
            tabindex="-1">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">

                            Delete Section

                        </h5>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                        </button>

                    </div>

                    <div class="modal-body">

                        Are you sure you want to delete
                        <strong>{{ section.name }}</strong>?

                    </div>

                    <div class="modal-footer">

                        <button
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Cancel

                        </button>

                        <form
                            method="post"
                            action="/section/{{ section.id }}/delete">

                            <button
                                class="btn btn-danger"
                                type="submit">

                                Delete

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    {% endfor %}

    </tbody>

</table>
